# BAZAR Marketplace - Configuration Développement
# Profile dev avec H2 en mémoire pour développement local

spring:
  datasource:
    url: jdbc:h2:mem:bazar_dev
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
  
  # Redis désactivé en dev (optionnel)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Logging plus verbose en dev
logging:
  level:
    com.bazar.marketplace: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
  
# Security moins stricte en dev
security:
  headers:
    frame-options: SAMEORIGIN # Permet H2 console

# Dev specific features
bazar:
  marketplace:
    features:
      cache:
        enabled: false # Pas de cache en dev
        ttl: 60
      search:
        max-results: 100 # Moins de résultats en dev